<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tees & Co.</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#/" class="brand">
        <span class="brand-logo">👕</span>
        <span class="brand-name">Tees & Co.</span>
      </a>
      <nav class="nav">
        <a href="#/" class="nav-link">Shop</a>
        <a href="#/cart" class="nav-link cart-link" aria-label="Cart">
          <span class="cart-icon">🛒</span>
          <span class="cart-count" id="cartCount">0</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container" id="app" aria-live="polite"></main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© <span id="year"></span> Tees & Co. All rights reserved.</p>
      <nav class="footer-nav">
        <a href="#/" class="footer-link">Home</a>
        <a href="#/cart" class="footer-link">Cart</a>
        <a href="#/checkout" class="footer-link">Checkout</a>
      </nav>
    </div>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
